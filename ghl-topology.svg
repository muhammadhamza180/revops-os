<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="100%">
  <defs>
    <linearGradient id="ghlBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c0e17"/>
      <stop offset="100%" stop-color="#07080e"/>
    </linearGradient>
    <linearGradient id="cardAcq" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardDispo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="cardOutbound" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <clipPath id="ghlClip">
      <rect x="10" y="10" width="860" height="320" rx="14"/>
    </clipPath>
  </defs>

  <style>
    .ghl-hdr { font-family: 'SF Mono', Monaco, monospace; font-size: 11px; font-weight: 700; fill: #64748b; letter-spacing: 1px; }
    .ghl-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #ffffff; }
    .ghl-sub { font-family: 'SF Mono', Monaco, monospace; font-size: 9.5px; fill: #94a3b8; }
    .ghl-badge { font-family: 'SF Mono', Monaco, monospace; font-size: 9px; font-weight: 800; }
    .ghl-metric { font-family: 'SF Mono', Monaco, monospace; font-size: 12px; font-weight: 800; }

    @keyframes pulseArrow {
      0%, 100% { opacity: 0.3; transform: translateX(0); }
      50% { opacity: 1; transform: translateX(4px); }
    }
    .flow-arrow { animation: pulseArrow 1.5s infinite ease-in-out; }
  </style>

  <g clip-path="url(#ghlClip)">
    <rect x="10" y="10" width="860" height="320" rx="14" fill="url(#ghlBg)" stroke="#27272a" stroke-width="1.5"/>

    <!-- Top Telemetry Bar -->
    <g transform="translate(30, 36)">
      <circle cx="5" cy="4" r="4" fill="#3b82f6">
        <animate attributeName="opacity" values="1;0.2;1" dur="0.8s" repeatCount="indefinite"/>
      </circle>
      <text x="18" y="8" font-family="'SF Mono', Monaco, monospace" font-size="11" font-weight="700" fill="#38bdf8">GHL ENTERPRISE 3-SUB-ACCOUNT TOPOLOGY</text>

      <text x="370" y="8" class="ghl-hdr">PIPELINES: <tspan font-weight="800" fill="#10b981">8 ACTIVE</tspan></text>
      <text x="520" y="8" class="ghl-hdr">WORKFLOWS: <tspan font-weight="800" fill="#f59e0b">125+ DEPLOYED</tspan></text>
      <text x="830" y="8" text-anchor="end" class="ghl-hdr">EST. VALUE: <tspan font-weight="800" fill="#10b981">$15,000–$25,000</tspan></text>
    </g>
    <line x1="10" y1="54" x2="870" y2="54" stroke="#1e293b" stroke-width="1"/>

    <!-- 3 SUB-ACCOUNT CARDS -->

    <!-- SUB-ACCOUNT 1: OUTBOUND PROSPECTING -->
    <g transform="translate(30, 75)">
      <rect x="0" y="0" width="245" height="230" rx="12" fill="url(#cardOutbound)" stroke="#78350f" stroke-width="1.2"/>
      <rect x="12" y="12" width="130" height="18" rx="4" fill="#f59e0b" fill-opacity="0.15"/>
      <text x="18" y="25" class="ghl-badge" fill="#f59e0b">SUB-ACCOUNT 01</text>
      
      <text x="12" y="52" class="ghl-title">Cold Outbound &amp; Intake</text>
      <text x="12" y="68" class="ghl-sub">Cold Calling, SMS Drips &amp; Apollo</text>

      <line x1="12" y1="80" x2="233" y2="80" stroke="#451a03" stroke-width="1"/>

      <g transform="translate(12, 98)" class="ghl-sub">
        <text x="0" y="0" fill="#d97706">● 40+ Cold Drip Campaigns</text>
        <text x="0" y="18" fill="#d97706">● Mathematical Scoring (#1-4)</text>
        <text x="0" y="36" fill="#d97706">● Opt-Out Compliance Auto-Stop</text>
        <text x="0" y="54" fill="#d97706">● 30-Day Stale Recycling Loop</text>
        <text x="0" y="72" fill="#d97706">● Cold Caller Qualification Form</text>
      </g>

      <rect x="12" y="190" width="221" height="26" rx="6" fill="#0c0a09" stroke="#78350f" stroke-width="0.8"/>
      <text x="20" y="207" font-family="'SF Mono', Monaco, monospace" font-size="9" font-weight="700" fill="#fef3c7">SCORE ≥ 75 → AUTO-PROMOTE</text>
    </g>

    <!-- CONNECTOR ARROW 1 -->
    <g transform="translate(285, 175)" class="flow-arrow">
      <path d="M 0 0 L 14 0 M 10 -4 L 14 0 L 10 4" stroke="#f59e0b" stroke-width="2" fill="none"/>
    </g>

    <!-- SUB-ACCOUNT 2: ACQUISITIONS CORE -->
    <g transform="translate(315, 75)">
      <rect x="0" y="0" width="250" height="230" rx="12" fill="url(#cardAcq)" stroke="#3730a3" stroke-width="1.2"/>
      <rect x="12" y="12" width="130" height="18" rx="4" fill="#6366f1" fill-opacity="0.15"/>
      <text x="18" y="25" class="ghl-badge" fill="#818cf8">SUB-ACCOUNT 02</text>
      
      <text x="12" y="52" class="ghl-title">Acquisitions Core OS</text>
      <text x="12" y="68" class="ghl-sub">Underwriting &amp; Contract Closing</text>

      <line x1="12" y1="80" x2="238" y2="80" stroke="#312e81" stroke-width="1"/>

      <g transform="translate(12, 98)" class="ghl-sub">
        <text x="0" y="0" fill="#a5b4fc">● 55+ Underwriting Workflows</text>
        <text x="0" y="18" fill="#a5b4fc">● 24h/48h SLA Escalation Guard</text>
        <text x="0" y="36" fill="#a5b4fc">● Auto-Generate Purchase Contract</text>
        <text x="0" y="54" fill="#a5b4fc">● Rep Round-Robin Assignment</text>
        <text x="0" y="72" fill="#a5b4fc">● Dual Pipeline Status Sync</text>
      </g>

      <rect x="12" y="190" width="226" height="26" rx="6" fill="#090d16" stroke="#4338ca" stroke-width="0.8"/>
      <text x="20" y="207" font-family="'SF Mono', Monaco, monospace" font-size="9" font-weight="700" fill="#c7d2fe">CONTRACT SIGNED → DISPO SYNC</text>
    </g>

    <!-- CONNECTOR ARROW 2 -->
    <g transform="translate(575, 175)" class="flow-arrow">
      <path d="M 0 0 L 14 0 M 10 -4 L 14 0 L 10 4" stroke="#10b981" stroke-width="2" fill="none"/>
    </g>

    <!-- SUB-ACCOUNT 3: DISPOSITIONS & TC -->
    <g transform="translate(605, 75)">
      <rect x="0" y="0" width="245" height="230" rx="12" fill="url(#cardDispo)" stroke="#065f46" stroke-width="1.2"/>
      <rect x="12" y="12" width="130" height="18" rx="4" fill="#10b981" fill-opacity="0.15"/>
      <text x="18" y="25" class="ghl-badge" fill="#34d399">SUB-ACCOUNT 03</text>
      
      <text x="12" y="52" class="ghl-title">Dispositions &amp; TC</text>
      <text x="12" y="68" class="ghl-sub">Buyer Blasts &amp; Title Escrow</text>

      <line x1="12" y1="80" x2="233" y2="80" stroke="#064e3b" stroke-width="1"/>

      <g transform="translate(12, 98)" class="ghl-sub">
        <text x="0" y="0" fill="#6ee7b7">● VIP Cash Buyer Blast Broadcasts</text>
        <text x="0" y="18" fill="#6ee7b7">● Automated Assignment Contracts</text>
        <text x="0" y="36" fill="#6ee7b7">● Title Company Milestone Checks</text>
        <text x="0" y="54" fill="#6ee7b7">● EMD Tracking &amp; Escrow SOPs</text>
        <text x="0" y="72" fill="#6ee7b7">● Payout Calculation Engine</text>
      </g>

      <rect x="12" y="190" width="221" height="26" rx="6" fill="#021f18" stroke="#047857" stroke-width="0.8"/>
      <text x="20" y="207" font-family="'SF Mono', Monaco, monospace" font-size="9" font-weight="700" fill="#a7f3d0">DEAL CLOSED → COMMISSIONS</text>
    </g>

  </g>
</svg>
